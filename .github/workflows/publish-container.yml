name: Create and publish a Docker image

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE_NAME: ${{ github.repository }}

jobs:
  # This job finds all subdirectories containing a Dockerfile and filters to only changed images for PRs.
  list-images:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.changed-images.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Needed for git diff
      - name: Detect changed images
        id: changed-images
        run: |
          # Get list of all directories with Dockerfiles
          all_images=$(find * -maxdepth 1 -name Dockerfile -print0 | xargs -0 -n1 dirname | grep -v '^\.' | jq -R . | jq -cs .)
          echo "All images: ${all_images}"

          detect_changed_images() {
            local changed_files="$1"
            echo "Changed files: ${changed_files}"

            # If .github itself changed, the build config may have changed — rebuild everything
            if echo "${changed_files}" | grep -q '^\.github/'; then
              echo "Build configuration changed, rebuilding all images"
              echo "images=${all_images}" >> $GITHUB_OUTPUT
              return
            fi

            # Find images in changed directories, intersected with all_images to exclude
            # dotfiles and directories without a Dockerfile
            changed_dirs=$(echo "${changed_files}" | grep -o '^[^/]*' | sort -u | jq -R . | jq -cs . 2>/dev/null || echo "[]")
            changed_images=$(jq -nc --argjson all "${all_images}" --argjson changed "${changed_dirs}" \
              '$changed | map(select(. as $x | $all | index($x)))')
            echo "Changed images: ${changed_images}"
            echo "images=${changed_images}" >> $GITHUB_OUTPUT
          }

          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            # For PRs, find images with changed files in their directories
            base_ref='${{ github.base_ref }}'
            head_ref='${{ github.head_ref }}'
            echo "Comparing ${head_ref} against ${base_ref}"

            changed_files=$(git diff --name-only "origin/${base_ref}"...HEAD 2>/dev/null || git diff --name-only "${base_ref}"...HEAD 2>/dev/null || echo "")

            if [[ -z "${changed_files}" ]]; then
              echo "No changes detected, building all images"
              echo "images=${all_images}" >> $GITHUB_OUTPUT
            else
              detect_changed_images "${changed_files}"
            fi
          else
            # For push to main, diff against the previous HEAD to find what actually changed
            before='${{ github.event.before }}'
            if [[ "$before" =~ ^0+$ ]] || ! git rev-parse --verify "${before}" &>/dev/null; then
              echo "No previous commit reference, building all images"
              echo "images=${all_images}" >> $GITHUB_OUTPUT
            else
              echo "Comparing HEAD against ${before}"
              changed_files=$(git diff --name-only "${before}" HEAD 2>/dev/null || echo "")

              if [[ -z "${changed_files}" ]]; then
                echo "No changes detected, skipping all builds"
                echo "images=[]" >> $GITHUB_OUTPUT
              else
                detect_changed_images "${changed_files}"
              fi
            fi
          fi

  # This job builds and pushes a container image for each of the directories found by the `list-images` job.
  build-and-push-image:
    needs: [list-images]
    if: ${{ needs.list-images.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    # This strategy creates a parallel build for each image, which speeds up the overall workflow.
    strategy:
      matrix:
        image: ${{ fromJson(needs.list-images.outputs.images) }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      # These steps set up QEMU and Buildx to enable multi-platform builds.
      - name: Setup qemu
        uses: docker/setup-qemu-action@v4
      - name: Setup buildx
        uses: docker/setup-buildx-action@v4
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Syft
        run: |
          mkdir -p ${{ github.workspace }}/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b ${{ github.workspace }}/bin
          echo "${{ github.workspace }}/bin" >> $GITHUB_PATH

      - name: Log in to the Container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@17f7c1809f7467d4244b4ff01b0dbe0b8b9e3d43
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get named tag
        id: namedtag
        shell: bash
        run: |
          echo "namedtag=$(cat ./${{ matrix.image }}/.tag 2>/dev/null || true)" >> $GITHUB_OUTPUT
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@703896b4f30f62d53f5530a80bcdc589a3f702bc
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.namedtag.outputs.namedtag }},enable=${{ steps.namedtag.outputs.namedtag != '' }}
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@b99c92828ab902cd2c54088e778f547a66bf746f
        with:
          context: ${{ matrix.image }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate SBOM
        run: |
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          .github/scripts/generate-sbom.sh "${FIRST_TAG}"
      - name: Generate artifact attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}/${{ matrix.image }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
